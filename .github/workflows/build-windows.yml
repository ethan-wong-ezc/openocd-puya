name: Build OpenOCD for Windows (x86_64)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-texinfo
            mingw-w64-x86_64-gettext
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libusb-compat
            mingw-w64-x86_64-libftdi
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-capstone

      - name: Build OpenOCD
        shell: msys2 {0}
        run: |
          set -eo pipefail
          bash ./build-win.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openocd-win64
          path: openocd-win64.tar.xz
          if-no-files-found: error

      - name: Create Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v0.12.0-win64-${{ github.run_number }}"
          gh release create "${TAG}" \
            --title "OpenOCD Windows x86_64 build ${{ github.run_number }}" \
            --notes "Automated Windows build for commit ${{ github.sha }}" \
            openocd-win64.tar.xz
